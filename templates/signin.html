<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sigin</title>
    <link rel="stylesheet" href="{{url_for('static' , filename = 'style2.css')}}">
</head>
<body>
    {%block content%}
    <form action="{{url_for('alry.signin')}}" method="POST" class="form">
    <input type="text" placeholder="enter_your_name" name="name" value="{{ name if name }}"> 
    <input type="password" name="password" placeholder="enter_your_password">

        <button class="button" type="submit">Submit</button>


    </form>
    {%if message%}
    <p>{{message}}</p>
    {%endif%}
    {%endblock%}
</body>
</html>
