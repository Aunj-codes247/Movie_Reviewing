<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>movies</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <form action="/movies" method="GET"  >
        <input type="text" name="q" placeholder="enter the movie name">
        <input type="submit">
    </form>
    <h1>Here are your movies</h1>

    

    {%for movie in posts%}
        <div class="photo">
            {%if movie.Poster != "N/A"%}
             <img src="{{ movie.Poster }}" alt="{{ movie.Title }}">
        </div>
        <form action="/movies" method = 'POST'>
            <input type="hidden" name="movie_id" value="{{ movie.imdbID }}" >
            <button type="submit" name="rating" value="1">1</button>
            <button type="submit" name="rating" value="2">2</button>
            <button type="submit" name="rating" value="3">3</button>
            <button type="submit" name="rating" value="4">4</button>
            <button type="submit" name="rating" value="5">5</button>

        </form>
          
        
        {% else %}
           <span>no poster available</span>
        {%endif%}
        <h5>{{ movie.Title }}</h5>
        <span>{{ movie.Type }}</span>
        <span>{{ movie.Year }}</span>


     {% else %}
      no movie found
    {%endfor%}

    
</body>
</html>
